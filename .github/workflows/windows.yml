name: 윈도우 앱

# PyInstaller는 크로스 컴파일을 못 해서 윈도우 앱은 윈도우에서 만들어야 한다.
# Actions 탭에서 "Run workflow"를 누르면 실행 결과 페이지의 Artifacts에 앱 폴더가 올라온다.
on:
  workflow_dispatch:

jobs:
  build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'

      # 한 파일(--onefile)로 묶으면 켤 때마다 임시 폴더에 풀고 백신이 그걸 다시 검사해서 뜨는 데 몇 초 걸린다.
      # 폴더로 둔다.
      - name: 앱 만들기
        run: |
          pip install pyinstaller pywebview==6.2.1 pillow
          pyinstaller --noconfirm --windowed --name "Agent HUD" --icon docs/images/apple-touch-icon.png --paths . app/windows/agent_hud.py

      # 창이 뜨고 엔진이 응답하는지, 상태 화면이 실패하지 않는지만 본다
      - name: 떠서 응답하는지
        shell: pwsh
        run: |
          $p = Start-Process "dist\Agent HUD\Agent HUD.exe" -PassThru
          $ok = $false
          for ($i = 0; $i -lt 30; $i++) {
            try {
              if ((Invoke-RestMethod http://127.0.0.1:41717/manifest.json).name -eq "Agent HUD") {
                Invoke-RestMethod http://127.0.0.1:41717/api/state | Out-Null
                $ok = $true; break
              }
            } catch {}
            Start-Sleep 1
          }
          Stop-Process $p
          if (-not $ok) { exit 1 }

      - uses: actions/upload-artifact@v4
        with:
          name: agent-hud-windows
          path: dist/Agent HUD
